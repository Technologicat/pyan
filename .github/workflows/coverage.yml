name: Coverage

on:
  push:
    # Every branch, so work in progress gets the same coverage run as `master` does.
    # Dependabot's are the exception: GitHub hands its runs Dependabot secrets rather than Actions
    # secrets, so `CODECOV_TOKEN` would be empty and the upload would fail on every bump. A bump's
    # coverage run is the one that happens on `master` after it merges.
    branches-ignore: ['dependabot/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codecov:
    # Upstream only. A fork runs this on its own pushes with no `CODECOV_TOKEN` of its own, and
    # Codecov wants one for a permanent branch even on a public repo, so without this the workflow
    # greets every contributor with a red run about a secret they were never meant to hold.
    if: github.repository == 'Technologicat/pyan'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python 3.15
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        # The newest Python the project supports, i.e. the top of the CI matrix —
        # that is where new-syntax code paths actually run. Bump this whenever the
        # matrix grows; nothing else will remind you.
        python-version: "3.15"
        # 3.15 is at rc1, which the setup-python manifest marks unstable, so a bare
        # "3.15" resolves to nothing without this. Becomes a no-op once 3.15 final ships.
        allow-prereleases: true
    - name: Install system dependencies
      run: |
        sudo apt-get update -q
        sudo apt-get install -yq graphviz
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pdm
        pdm install
    - name: Generate coverage report
      run: |
        pdm run pytest tests/ -v --cov-branch --cov-report=xml:coverage.xml
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
