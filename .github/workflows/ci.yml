name: CI

on:
  push:
    branches: [ master ]
    tags: ["v*"]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Full Python matrix on Linux; newest Python only on macOS and Windows.
        # Rationale: pyan3 is pure Python, so platform-specific bugs (path
        # handling, subprocess launch, line endings, ...) are almost never
        # Python-version-specific.  The extra 8 jobs to cover every Python
        # version on every OS would just re-find the same bugs in parallel.
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          - os: macos-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.14"

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python ${{ matrix.python-version }} on ${{ matrix.os }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}
        # Lets a Python at alpha/beta/rc resolve: the setup-python manifest marks
        # prereleases unstable, so without this a bare version such as "3.16" resolves
        # to nothing. A no-op wherever a stable release exists, so it stays in for good
        # rather than being added and removed around each new Python.
        allow-prereleases: true
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pdm
        pdm install
    - name: Lint with ruff
      run: pdm run ruff check .
    # Continuation-line indentation, which ruff does not implement. The E12 codes the house keeps, listed
    # one by one: given `--select`, pycodestyle disregards `--ignore`, so E126 and E127 cannot be dropped
    # from a wider selection. The excludes are ruff's.
    - name: Lint continuation lines with pycodestyle
      run: pdm run python -m pycodestyle --select=E121,E122,E123,E124,E125,E128,E129,E131 --exclude=.git,__pycache__,build,dist,.venv,test_code_312,test_code_315,lint_canary_fixture.py .
    # Whether the two steps above still report what they are relied on to catch.
    - name: Lint canary
      run: pdm run python scripts/check_lint_canary.py
    - name: Test with pytest
      run: |
        pdm run pytest tests/ -v

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
